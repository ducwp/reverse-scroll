name: Build DMG

on:
  push:
    tags: ["v*"]        # đẩy tag dạng v0.5.0 để build và phát hành
  workflow_dispatch:     # cho phép bấm chạy tay trên tab Actions

permissions:
  contents: write        # cần để đính kèm DMG vào Release

jobs:
  build:
    runs-on: macos-latest   # macOS thật: cần hdiutil, sips, iconutil, codesign

    steps:
      - uses: actions/checkout@v4

      - name: Cài Rust (đủ 2 target cho universal binary)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Build DMG
        run: |
          chmod +x build-dmg.sh
          ./build-dmg.sh
        # Ký chính thức (tuỳ chọn): đặt SIGN_ID, xem phần Ghi chú trong README

      - name: Lưu DMG làm artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReverseScroll-dmg
          path: dist/*.dmg

      - name: Đính kèm vào GitHub Release (khi build từ tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg